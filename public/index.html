<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SOCKETChat | Real-Time Connect</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body>
  <!-- ==================== -->
  <!-- USERNAME GATE SCREEN -->
  <!-- ==================== -->
  <div id="username-gate" class="gate">
    <div class="gate-modal">
      <div class="gate-brand">
        <i class="ph-fill ph-shield-check"></i>
        <h1>SOCKET<span style="color: var(--primary-light);">CHAT</span></h1>
      </div>
      <h2>Welcome to the SOCKET</h2>
      <p>Secure, fast, and real-time messaging.</p>
      <div class="gate-input-wrapper">
        <i class="ph ph-user-circle"></i>
        <input id="user" placeholder="Choose a nickname..." autocomplete="off" />
      </div>
      <button id="set-username-btn">Connect to SOCKET</button>
    </div>
  </div>

  <!-- ==================== -->
  <!-- MAIN APPLICATION -->
  <!-- ==================== -->
  <div id="main-app" class="app-container">
    
    <!-- MOBILE TOP BAR -->
    <div id="mobile-top-bar" class="mobile-top-bar">
      <div class="brand-area">
        <i class="ph-fill ph-shield-check"></i>
        <span>SOCKET<span style="color: var(--primary-light);">CHAT</span></span>
      </div>
      <button id="mobile-menu-btn" class="mobile-menu-btn">
        <i class="ph ph-list"></i>
      </button>
    </div>

    <!-- DESKTOP SIDEBAR -->
    <aside id="sidebar" class="sidebar">
      <div class="brand-area">
        <i class="ph-fill ph-shield-check"></i>
        <span>SOCKET<span style="color: var(--primary-light);">CHAT</span></span>
      </div>

      <!-- USER PROFILE CARD -->
      <div class="user-card">
        <div class="avatar"><i class="ph ph-user"></i></div>
        <div class="user-info">
          <h3 id="display-username">Guest</h3>
          <div class="status-indicator">
            <span class="status-dot"></span>
            <small>Online</small>
          </div>
        </div>
      </div>

      <!-- ROOM LIST SECTION -->
      <div class="sidebar-content">
        <div class="section-header">
          <span class="section-label">CHANNEL BROWSER</span>
          <i class="ph ph-broadcast"></i>
        </div>
        <div id="room-list" class="room-list">
          <!-- Room items will be populated by JavaScript -->
        </div>
      </div>

      <!-- SIDEBAR FOOTER -->
      <div class="sidebar-footer">
        <div class="global-stats">
          <i class="ph ph-users-three"></i>
          <span id="global-count">0</span> Users Online
        </div>
      </div>
    </aside>

    <!-- MAIN CHAT AREA -->
    <main class="chat-area">
      <!-- CHAT HEADER -->
      <header id="chat-header">
        <div class="header-info">
          <div class="header-title-row">
            <i class="ph-bold ph-chats-teardrop"></i>
            <h1 id="main-app-title">SOCKETChat Lobby</h1>
          </div>
          <div class="room-info">
            <p id="room-header" class="room-badge global">Global Lobby</p>
            <p id="user-typing"></p>
            <div id="room-stats-header" class="room-stats-header"></div>
            <div id="global-stats-header" class="global-stats-header"></div>
          </div>
        </div>
        <button id="leave-room-btn" class="danger-btn hidden">
          <i class="ph ph-arrow-left"></i> Exit to Lobby
        </button>
      </header>

      <!-- CHAT MESSAGES VIEWPORT -->
      <div class="chat-viewport">
        <div class="chat-box" id="chat-box">
          <!-- Messages will be populated here -->
        </div>
        
        <!-- ROOM PREVIEW OVERLAY -->
        <div id="room-preview-container" class="preview-overlay hidden">
          <!-- Room preview will be shown here -->
        </div>
        
        <!-- TYPING INDICATOR -->
        <div id="typing-indicator" class="typing-indicator hidden">
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <div class="typing-dot"></div>
          <span class="typing-text">someone is typing...</span>
        </div>
      </div>

      <!-- CHAT CONTROLS -->
      <footer id="chat-controls" class="controls-container">
        <!-- ROOM JOIN CONTROLS -->
        <div class="room-actions">
          <div class="input-with-icon">
            <i class="ph ph-hash"></i>
            <input id="room-id" placeholder="Enter Room ID manually..." />
          </div>
          <button id="room-btn">Join</button>
        </div>
        
        <!-- MESSAGE INPUT CONTROLS -->
        <div class="message-input-area">
          <div class="input-with-icon">
            <i class="ph ph-chat-circle-text"></i>
            <input id="text" placeholder="Type a message..." />
          </div>
          <button id="send-btn">
            <i class="ph ph-paper-plane-right"></i>
          </button>
        </div>
      </footer>
    </main>
  </div>

  <!-- ==================== -->
  <!-- MOBILE SIDEBAR OVERLAY -->
  <!-- ==================== -->
  <div id="mobile-sidebar-overlay" class="mobile-sidebar-overlay">
    <aside id="mobile-sidebar-content">
      <!-- MOBILE SIDEBAR HEADER -->
      <div class="mobile-sidebar-header">
        <div class="mobile-brand">
          <i class="ph-fill ph-shield-check"></i>
          <span>SOCKET<span style="color: var(--primary-light);">CHAT</span></span>
        </div>
        <button class="mobile-sidebar-close" id="mobile-sidebar-close">
          <i class="ph ph-x"></i>
        </button>
      </div>

      <!-- MOBILE USER CARD -->
      <div class="mobile-user-card">
        <div class="mobile-avatar"><i class="ph ph-user"></i></div>
        <div class="mobile-user-info">
          <h3 id="mobile-display-username">Guest</h3>
          <div class="status-indicator">
            <span class="status-dot"></span>
            <small>Online</small>
          </div>
        </div>
      </div>

      <!-- MOBILE ROOM LIST -->
      <div class="mobile-room-list">
        <div class="section-header">
          <span class="section-label">CHANNEL BROWSER</span>
          <i class="ph ph-broadcast"></i>
        </div>
        <div id="mobile-room-list" class="room-list">
          <!-- Room items will be populated by JavaScript -->
        </div>
      </div>

      <!-- MOBILE SIDEBAR FOOTER -->
      <div class="mobile-sidebar-footer">
        <div class="global-stats">
          <i class="ph ph-users-three"></i>
          <span id="mobile-global-count">0</span> Users Online
        </div>
      </div>
    </aside>
  </div>

  <!-- ==================== -->
  <!-- SCRIPTS -->
  <!-- ==================== -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="script.js"></script>
</body>
</html>
